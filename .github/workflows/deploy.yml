name: Deploy to NAS

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - '.research/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # cloudflared access ssh reads TUNNEL_SERVICE_TOKEN_ID/SECRET from env automatically
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Setup SSH via Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Configure SSH to use cloudflared as proxy for ssh.fyc-space.uk
          cat >> ~/.ssh/config << 'EOF'
          Host nas
            HostName ssh.fyc-space.uk
            User 392fyc
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
            StrictHostKeyChecking no
          EOF

          # Test connection
          ssh nas "echo 'SSH via Cloudflare Tunnel OK'"

      - name: Transfer files to NAS
        run: |
          ARGUS_DIR="/share/homes/392fyc/argus"

          # Self-check runtime: the scheduler bind-mounts .:/workspace:ro and runs
          # these live from $ARGUS_DIR. run_self_check.sh lives under scripts/; the
          # five argus_*.py modules live at repo root. Ship all so the #22
          # SKIP_DOCKER_WRAPPER fix and its modules actually reach the NAS. See #29.
          for f in Dockerfile entrypoint-guard.py mention_rewrite.py patch_suggestion_format.py \
                   configuration.toml docker-compose.yml docker-compose.polling.yml \
                   argus_self_check.py argus_log_analyzer.py argus_extractor.py \
                   argus_events.py argus_issue_formatter.py \
                   scripts/run_self_check.sh; do
            if [ -f "$f" ]; then
              ssh nas "mkdir -p $ARGUS_DIR/$(dirname "$f")"
              cat "$f" | ssh nas "cat > $ARGUS_DIR/$f"
              echo "✓ $f"
            else
              echo "✗ MISSING in checkout: $f" >&2
              exit 1
            fi
          done

      - name: Rebuild and restart on NAS
        run: |
          ARGUS_DIR="/share/homes/392fyc/argus"
          DOCKER="/share/CACHEDEV1_DATA/.qpkg/container-station/bin/docker"
          DHOST="DOCKER_HOST=unix:///var/run/system-docker.sock"

          ssh nas "
            # fail-fast: a failed pr-agent build/up must abort before the scheduler
            # recreate, otherwise the SSH exit status would reflect only the LAST
            # command (selfcheck-scheduler) and mask a failed primary rollout.
            # set -e only (no pipefail) — the NAS remote shell may be busybox, where
            # 'set -o pipefail' is unsupported and would itself abort under set -e.
            # The build therefore writes to a log file (no pipe) so its non-zero exit
            # reaches set -e directly; a trailing '| tail' would otherwise mask a
            # failed build behind tail's success exit (#476 Line D hardening).
            set -e
            if ! echo '${{ secrets.NAS_SUDO_PASS }}' | sudo -S $DHOST $DOCKER compose \
                 -f $ARGUS_DIR/docker-compose.yml build --no-cache pr-agent > /tmp/argus-build.log 2>&1; then
              echo 'pr-agent build FAILED — last 20 lines:' >&2
              tail -20 /tmp/argus-build.log >&2
              exit 1
            fi
            tail -5 /tmp/argus-build.log
            echo '${{ secrets.NAS_SUDO_PASS }}' | sudo -S $DHOST $DOCKER compose \
              -f $ARGUS_DIR/docker-compose.yml up -d --force-recreate pr-agent 2>&1
            # Recreate the self-check scheduler too so the compose-defined
            # SKIP_DOCKER_WRAPPER=1 env (present since #22) is applied to the running
            # container. --force-recreate guarantees recreation even if compose sees no
            # config delta. No rebuild: the image bakes no source; the self-check code
            # comes from the .:/workspace:ro bind-mount refreshed in the transfer step.
            echo '${{ secrets.NAS_SUDO_PASS }}' | sudo -S $DHOST $DOCKER compose \
              -f $ARGUS_DIR/docker-compose.yml up -d --force-recreate selfcheck-scheduler 2>&1
          "

      - name: Verify deployment
        run: |
          sleep 15
          DOCKER="/share/CACHEDEV1_DATA/.qpkg/container-station/bin/docker"
          DHOST="DOCKER_HOST=unix:///var/run/system-docker.sock"

          STATUS=$(ssh nas \
            "echo '${{ secrets.NAS_SUDO_PASS }}' | sudo -S $DHOST $DOCKER ps --filter name=argus --format '{{.Status}}' 2>/dev/null | head -1")
          echo "Container status: $STATUS"
          if echo "$STATUS" | grep -q "Up"; then
            echo "✅ Argus deployed successfully"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
